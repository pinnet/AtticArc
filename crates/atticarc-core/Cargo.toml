[package]
name = "atticarc-core"
description = "Scanning, hashing, archiving and catalogue logic shared by the AtticARC CLI and GUI."
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = "0.4.45"
regex = "1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-turbo = { version = "0.29.3", features = ["compress", "util"] }
sha2 = "0.11.1"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile = "3.27.0"
