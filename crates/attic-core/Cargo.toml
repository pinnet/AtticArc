[package]
name = "attic-core"
description = "Scanning, hashing, archiving and catalogue logic shared by the Attic ARC CLI and GUI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = "0.4.45"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-turbo = { version = "0.29.3", features = ["compress", "util"] }
sha2 = "0.11.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
