[workspace]
resolver = "3"
members = ["crates/atticarc-core", "crates/atticarc-cli", "crates/atticarc-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

# Compression and hashing are unbearably slow unoptimised, even in debug builds.
[profile.dev.package."*"]
opt-level = 3
